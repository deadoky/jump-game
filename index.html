const API = 'https://jump-scores.deadoky.workers.dev'; // адрес сервера рекордов (Cloudflare Worker)
let board = null; // таблица рекордов: null — нет, 'loading' — грузится, массив — готово
function sendScore(s) { // только внутри Telegram: подпись initData подтверждает, кто играл
  const data = window.Telegram?.WebApp?.initData; if (!data) return;
  board = 'loading';
  fetch(API + '/score', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ initData: data, score: Math.floor(s) }) })
    .then(r => r.json()).then(t => { board = Array.isArray(t) ? t : null }).catch(() => { board = null });
}
let best = 0; try { best = +localStorage.getItem('best') || 0 } catch {}
let p, plats, drops, dropT, dropNext, score, over, keys = { l:false, r:false };

function reset() {
  p = { x: W/2 - S/2, y: H - 150, vx: 0, vy: JUMP };
  plats = [{ x: W/2 - 35, y: H - 40, dx: 0 }];
  score = 0; over = false; drops = []; dropT = 0; dropNext = 5000 + Math.random() * 5000;
  while (plats.at(-1).y > -40) addPlat();
}
function addPlat() {
  const top = plats.at(-1).y, gap = 60 + Math.min(score / 60, 60) + Math.random() * 30; // max jump height ~195px
  plats.push({ x: Math.random() * (W - 70), y: top - gap, dx: score > 1500 && Math.random() < 0.3 ? 1.5 : 0 });
}

function step(k) {
  if (over) return;
  p.vx = (keys.r - keys.l) * 6;
  p.x += p.vx * k; p.vy += GRAV * k; p.y += p.vy * k;
  if (p.x >= W) p.x -= W; if (p.x < 0) p.x += W; // wrap by exactly W: the twin drawn at the other edge becomes the hero, no jump
  for (const pl of plats) {
    pl.x += pl.dx * k; if (pl.x < 0 || pl.x > W - 70) pl.dx *= -1;
    const feet = p.y + S;
    if (p.vy > 0 && feet >= pl.y && feet - p.vy * k <= pl.y + 2 && [p.x, p.x - W].some(x => x + S - 10 > pl.x && x + 10 < pl.x + 70)) p.vy = JUMP;
  }
  if (p.y < H * 0.4) { // scroll world up
    const d = H * 0.4 - p.y; p.y += d; score += d;
    plats.forEach(pl => pl.y += d); drops.forEach(o => o.y += d);
    plats = plats.filter(pl => pl.y < H + 20);
    while (plats.at(-1).y > -40) addPlat();
  }
  dropT += k * 16.67;
  if (dropT >= dropNext) { dropT = 0; dropNext = 5000 + Math.random() * 5000; drops.push({ x: 30 + Math.random() * (W - 60), y: -60, a: 0, va: (Math.random() < .5 ? -1 : 1) * 0.08 }); }
  for (const o of drops) {
    o.y += 4 * k; o.a += o.va * k;
    // shortcut: round hitbox, ignores the sprite's tall shape; switch to a rotated box if hits feel unfair
    if ([p.x, p.x - W].some(x => Math.hypot(o.x - (x + S/2), o.y - (p.y + S/2)) < S/2 + 18)) over = 'hit';
  }
  drops = drops.filter(o => o.y < H + 80);
  if (p.y > H) over = true; if (over) { if (score > best) { best = score; try { localStorage.setItem('best', Math.floor(best)) } catch {} } sendScore(score) }
}

function draw() {
  g.fillStyle = '#0b0b0d'; g.fillRect(0, 0, W, H);
  if (bg.naturalWidth) { // cover-fit, centered
    const k = Math.max(W / bg.naturalWidth, H / bg.naturalHeight), bw = bg.naturalWidth * k, bh = bg.naturalHeight * k;
    g.drawImage(bg, (W - bw) / 2, (H - bh) / 2, bw, bh);
  }
  g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(0, 0, W, H); // dim the photo
  for (const pl of plats) { g.fillStyle = pl.dx ? '#7a4e12' : '#24521f'; g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 1.5; g.beginPath(); g.roundRect(pl.x, pl.y, 70, 14, 7); g.fill(); g.stroke(); }
  if (bong.naturalWidth) for (const o of drops) {
    const h = 90, w = h * bong.width / bong.height;
    g.save(); g.translate(o.x, o.y); g.rotate(o.a); g.drawImage(bong, -w/2, -h/2, w, h); g.restore();
  }
  for (const dx of [0, p.x > W - S ? -W : null]) { // draw a twin while crossing the edge
    if (dx === null) continue;
    g.save(); g.beginPath(); g.arc(p.x + dx + S/2, p.y + S/2, S/2, 0, Math.PI * 2); g.clip();
    if (face.complete) g.drawImage(face, p.x + dx, p.y, S, S);
    g.restore();
    g.strokeStyle = '#f4f6fb'; g.lineWidth = 3; g.beginPath(); g.arc(p.x + dx + S/2, p.y + S/2, S/2, 0, Math.PI * 2); g.stroke();
  }
  g.fillStyle = '#f4f6fb'; g.font = '700 22px system-ui, sans-serif'; g.textAlign = 'left';
  g.fillText(Math.floor(score), 14, 32);
  g.font = '500 14px system-ui, sans-serif'; g.fillText('Рекорд: ' + Math.floor(best), 14, 52);
  if (touch && !over) { // hint where to tap
    g.fillStyle = 'rgba(244,246,251,.18)'; g.font = '700 48px system-ui, sans-serif';
    g.textAlign = 'left'; g.fillText('‹', 20, H - 24); g.textAlign = 'right'; g.fillText('›', W - 20, H - 24);
  }
  if (over) {
    g.fillStyle = 'rgba(10,16,32,.7)'; g.fillRect(0, 0, W, H);
    g.fillStyle = '#f4f6fb'; g.textAlign = 'center';
    g.font = '800 34px system-ui, sans-serif'; g.fillText(over === 'hit' ? 'Сбит!' : 'Упал!', W/2, H/2 - 30);
    g.font = '600 20px system-ui, sans-serif'; g.fillText('Счёт: ' + Math.floor(score), W/2, H/2 + 6);
    g.font = '500 15px system-ui, sans-serif'; g.fillText(touch ? 'Коснись экрана — заново' : 'Пробел или клик — заново', W/2, H/2 + 40);
    if (board) {
      g.font = '700 16px system-ui, sans-serif'; g.fillText('🏆 Таблица рекордов', W/2, H/2 + 80);
      g.font = '500 14px system-ui, sans-serif';
      if (board === 'loading') g.fillText('загружаю…', W/2, H/2 + 104);
      else board.slice(0, 10).forEach((r, i) => g.fillText(`${i + 1}. ${r.name} — ${r.score}`, W/2, H/2 + 104 + i * 20));
    }
  }
}

let last = performance.now();
function loop(t) { const k = Math.min((t - last) / 16.67, 3); last = t; step(k); draw(); requestAnimationFrame(loop); }

const setKey = (e, v) => {
  if (['ArrowLeft','a','A','ф','Ф'].includes(e.key)) keys.l = v;
  if (['ArrowRight','d','D','в','В'].includes(e.key)) keys.r = v;
  if (v && e.key === ' ' && over) reset();
};
addEventListener('keydown', e => setKey(e, true));
addEventListener('keyup', e => setKey(e, false));
// each finger remembers its side, so two-finger play and sliding across the middle work
const fingers = new Map();
const side = e => { const r = cv.getBoundingClientRect(); return e.clientX - r.left < r.width / 2 ? 'l' : 'r'; };
const sync = () => { const s = [...fingers.values()]; keys.l = s.includes('l'); keys.r = s.includes('r'); };
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (over) { fingers.clear(); sync(); return reset(); }
  fingers.set(e.pointerId, side(e)); sync();
});
cv.addEventListener('pointermove', e => { if (fingers.has(e.pointerId)) { fingers.set(e.pointerId, side(e)); sync(); } });
for (const ev of ['pointerup', 'pointercancel']) addEventListener(ev, e => { fingers.delete(e.pointerId); sync(); });
cv.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', () => { fingers.clear(); sync(); last = performance.now(); });

{ const tg = window.Telegram?.WebApp; if (tg) { tg.ready(); tg.expand(); tg.disableVerticalSwipes?.(); } } // Telegram: full screen, swipe-down won't close the game
reset(); requestAnimationFrame(loop);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
